name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Force install pnpm
        run: npm i -g pnpm@9

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          standalone: true
          run_install: false

      - name: Fallback install pnpm (if missing)
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            npm i -g pnpm@9
          fi

      - name: Verify pnpm
        run: |
          echo "PATH=$PATH"
          which pnpm || true
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build
